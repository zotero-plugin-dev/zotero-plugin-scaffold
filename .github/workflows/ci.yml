name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup JS
        uses: zotero-plugin-dev/workflows/setup-js@main

      - name: Build Packages
        run: pnpm build

      - name: Upload build result
        uses: actions/upload-artifact@v7
        with:
          name: build-result
          path: packages/*/dist/

  test-unit:
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Setup JS
        uses: zotero-plugin-dev/workflows/setup-js@main

      - name: Restore Build Result
        uses: actions/download-artifact@v8
        with:
          name: build-result
          # The artifact root is `packages/`, so restore it there to keep the
          # `packages/*/dist` layout that the workspace packages link against.
          path: packages

      - name: Test
        run: pnpm test:unit

  test-e2e:
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Setup JS
        uses: zotero-plugin-dev/workflows/setup-js@main

      - name: Setup Zotero
        uses: zotero-plugin-dev/setup-zotero@main

      - name: Restore Build Result
        uses: actions/download-artifact@v8
        with:
          name: build-result
          path: packages

      - name: Test
        run: pnpm test:e2e

  docs:
    runs-on: ubuntu-latest
    needs:
      - build
    env:
      GITHUB_TOKEN: ${{ secrets.GitHub_TOKEN }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Setup JS
        uses: zotero-plugin-dev/workflows/setup-js@main
        with:
          fetch-all: 0

      - name: Restore Build Result
        uses: actions/download-artifact@v8
        with:
          name: build-result
          path: packages

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build Documentation
        run: pnpm docs:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/src/.vitepress/dist

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push'
        id: deployment
        uses: actions/deploy-pages@v5
