name: Release

# Frozen during the monorepo migration: no tag or pull request may publish a
# partially migrated release. Re-enable the `v**` tag trigger once the
# migration has landed on main and the reusable workflow
# (zotero-plugin-dev/workflows) supports publishing all workspace packages.
on:
  workflow_dispatch:

jobs:
  release:
    uses: zotero-plugin-dev/workflows/.github/workflows/release-npm.yml@main
    with:
      build: pnpm build
      cr: true
    permissions:
      contents: write
      id-token: write
