# playground -> zotero-types -> epubjs (resolved via git-repository)
blockExoticSubdeps: false
minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
shellEmulator: true

packages:
  - packages/*
  - "!**/dist/**"
  - docs
  # Precise paths, not `e2e/*`: `e2e/.tmp/` holds copies of the fixture at run
  # time, and a glob would treat each of them as a workspace member.
  - e2e
  - playground

overrides:
  vite: ^8.3.5

allowBuilds:
  "@swc/core": false
  es5-ext: false
  esbuild: false

catalog:
  "@fluent/syntax": ^0.19.0
  "@octokit/rest": ^22.0.1
  "@sinonjs/fake-timers": ^15.4.0
  "@swc/core": ^1.16.22
  "@types/chai": ^5.2.3
  "@types/mocha": ^10.0.10
  "@vitest/expect": ^5.1.0
  "@vitest/spy": ^5.1.0
  adm-zip: ^0.6.1
  bumpp: ^12.3.0
  c12: 4.0.0-rc.4
  chai: ^6.3.0
  changelogen: ^0.6.2
  chokidar: ^6.0.0
  commander: ^15.0.0
  es-toolkit: ^1.53.2
  esbuild: ^0.28.2
  fs-extra: ^11.4.1
  hookable: ^6.1.2
  mocha: ^12.0.3
  std-env: ^4.3.0
  tiny-update-notifier: ^2.0.2
  tinyglobby: ^0.2.17
  xvfb-ts: ^1.1.1

catalogs:
  dev:
    "@antfu/eslint-config": ^10.0.0
    "@commander-js/extra-typings": ^15.0.0
    "@shikijs/vitepress-twoslash": ^4.6.0
    "@types/fs-extra": ^11.0.4
    "@types/node": ^26.6.6
    "@typescript/native": npm:typescript@^7.0.2
    eslint: ^10.14.0
    eslint-plugin-format: ^2.0.1
    husky: ^9.1.7
    lint-staged: ^17.6.0
    oxc-minify: ^0.156.0
    tsdown: ^0.23.7
    typescript: ~6.0.3
    unplugin-raw: ^0.8.0
    vitepress: 2.0.0-alpha.21
    vitest: ^5.1.0

  playground:
    zotero-types: ^4.1.3
